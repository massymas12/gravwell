name: Build Collection Agents

on:
  workflow_dispatch:
    inputs:
      upload_to_server:
        description: "Upload binaries to gravwell server after build"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --clean --noconfirm \
            --name gravwell-collect \
            --hidden-import xml.etree.ElementTree \
            --hidden-import ssl \
            --hidden-import urllib.request \
            gravwell/agent/collect.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravwell-collect-${{ matrix.platform }}
          path: dist/gravwell-collect*
          retention-days: 30

      - name: Push to gravwell server
        if: ${{ inputs.upload_to_server }}
        env:
          GRAVWELL_SERVER_URL: ${{ secrets.GRAVWELL_SERVER_URL }}
          GRAVWELL_ADMIN_TOKEN: ${{ secrets.GRAVWELL_ADMIN_TOKEN }}
        shell: python
        run: |
          import os, pathlib, urllib.request, urllib.error, sys, ssl

          server = os.environ.get("GRAVWELL_SERVER_URL", "").rstrip("/")
          token  = os.environ.get("GRAVWELL_ADMIN_TOKEN", "")
          if not server or not token:
              print("GRAVWELL_SERVER_URL or GRAVWELL_ADMIN_TOKEN not set — skipping upload.")
              sys.exit(0)

          platform = "${{ matrix.platform }}"
          suffix   = ".exe" if platform == "windows" else ""
          name     = f"gravwell-collect{suffix}"

          binary_path = pathlib.Path("dist") / name
          if not binary_path.exists():
              print(f"Binary not found: {binary_path}")
              sys.exit(1)

          data = binary_path.read_bytes()

          boundary = "----GravWellBoundary"
          body = (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; name="file"; filename="{name}"\r\n'
              f"Content-Type: application/octet-stream\r\n\r\n"
          ).encode() + data + f"\r\n--{boundary}--\r\n".encode()

          url = f"{server}/api/agent/upload?platform={platform}"
          req = urllib.request.Request(
              url, data=body, method="POST",
              headers={
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
                  "X-Gravwell-Admin": token,
              },
          )
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode    = ssl.CERT_NONE
          try:
              with urllib.request.urlopen(req, context=ctx, timeout=60) as resp:
                  print(f"Uploaded {name} ({len(data):,} bytes) → {resp.read().decode()}")
          except urllib.error.HTTPError as exc:
              print(f"Upload failed HTTP {exc.code}: {exc.read().decode()}")
              sys.exit(1)

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move binaries into package
        shell: python
        run: |
          import pathlib, shutil, stat

          for platform in ("windows", "linux", "macos"):
              art_dir = pathlib.Path("artifacts") / f"gravwell-collect-{platform}"
              if not art_dir.exists():
                  print(f"No artifact for {platform}, skipping")
                  continue
              dest = pathlib.Path(f"gravwell/agent/binaries/{platform}")
              dest.mkdir(parents=True, exist_ok=True)
              for f in art_dir.iterdir():
                  if f.is_file():
                      target = dest / f.name
                      shutil.copy2(f, target)
                      if platform != "windows":
                          target.chmod(target.stat().st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
                      print(f"Copied {f.name} → {target}")

      - name: Commit and push binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gravwell/agent/binaries/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update pre-built agent binaries [skip ci]"
          git push
